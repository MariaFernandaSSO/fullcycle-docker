services:
  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    container_name: nginx
    ports:
      - "8080:80"
    depends_on:
      - app
    networks:
      - app-node-network

  app:
    build:
      context: ./node
      dockerfile: Dockerfile
    container_name: app
    volumes:
      - ./node:/usr/src/app
      - /usr/src/app/node_modules
    entrypoint: dockerize -wait tcp://db:3306 -timeout 60s sh -c "npm install && node index.js"
    tty: true
    depends_on:
      - db
    networks:
      - app-node-network

  db:
    image: mysql:5.7
    command: --innodb-use-native-aio=0
    container_name: db
    tty: true
    volumes:
      - mysql-data:/var/lib/mysql
    environment:
      - MYSQL_DATABASE=nodedb
      - MYSQL_ROOT_PASSWORD=root
    networks:
      - app-node-network

networks:
  app-node-network:
    driver: bridge

volumes:
  mysql-data: